<div class="blog-container">
	<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-atom" [fullScreen]="true">
		<p style="color: white"> Loading... </p>
	</ngx-spinner>

	<div class="page-header">
		<h1>Our Blog</h1>
		<p>Stay updated with our latest news and articles</p>
		<button class="btn-brand" (click)="openModal()">Add New Post</button>
	</div>

	<div class="blog-posts">
		<article class="blog-post" *ngFor="let post of blogPosts">
			<h2>{{ post.title }}</h2>
			<p class="post-date">{{ post.createdAt | date: 'dd MMMM yyyy' }}</p>
			<p class="post-excerpt">{{ excerpt(post.content) }}</p>
			<a [routerLink]="['/blog', post.id]" class="read-more">Read More</a>
		</article>

		<p class="empty-state" *ngIf="!blogPosts.length">No posts yet — check back soon.</p>
	</div>
</div>

<div class="modal" [class.show]="isModalOpen">
	<div class="modal-content">
		<span class="close" (click)="closeModal()">&times;</span>
		<h2>Add a New Post</h2>
		<form (ngSubmit)="onSubmit()" #postForm="ngForm">
			<div class="form-group">
				<label for="title">Title</label>
				<input type="text" id="title" name="title" [(ngModel)]="newPost.title" required>
			</div>
			<div class="form-group">
				<label for="post">Post</label>
				<textarea id="post" name="post" [(ngModel)]="newPost.content" required></textarea>
			</div>
			<button type="submit" class="btn-brand" [disabled]="!postForm.form.valid">Submit</button>
		</form>
	</div>
</div>
