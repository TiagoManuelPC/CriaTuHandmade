<div class="tab-container scrapbook">
	<div class="hero">
		<div class="logo-wrap">
			<div class="logo-plate"></div>
			<img src="./../../assets/app-logos/criatulogo.png" alt="Criatulogo" class="primary-image"
				[ngStyle]="{'max-width': imageMaxWidth}">
		</div>

		<div class="hero-side">
			<div class="stickers">
				<a href="https://www.instagram.com/cria.tu/" target="_blank" class="sticker sticker--round sticker--ig">
					<img src="assets/social-logos/Instagram_Glyph_Gradient.png" alt="Instagram">
				</a>
				<a href="https://www.etsy.com/uk/shop/CriaTuHandmade" target="_blank" class="sticker sticker--tag sticker--etsy">
					<img src="assets/social-logos/etsy.png" alt="Etsy">
				</a>
				<a href="https://www.facebook.com/criatu.art" target="_blank" class="sticker sticker--round sticker--fb">
					<img src="assets/social-logos/Facebook_Logo_Primary.png" alt="Facebook">
				</a>
			</div>

			<div class="postcard">
				<div class="stamp"></div>
				<div class="eyebrow">Say hello</div>
				<a href="mailto:cria.tu@outlook.com">cria.tu&#64;outlook.com</a>
			</div>
		</div>
	</div>

	<div class="wall">
		<div class="polaroid" *ngFor="let src of wallImages">
			<img [src]="src" alt="Handmade ornament">
		</div>
	</div>
</div>
